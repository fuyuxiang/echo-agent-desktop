[package]
name = "echoagent"
version = "0.3.9"
description = "EchoAgent — an open-source desktop agent workspace built on Tauri"
authors = ["EchoAgent"]
edition = "2021"
rust-version = "1.92.0"

# The Tauri library expects a lib target (for mobile, and so the binary can
# stay thin). We follow the standard Tauri 2 layout: `lib.rs` with a `run()`,
# and `main.rs` that calls it.
[lib]
name = "echoagent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# Pin the updater minor because `app_updater.rs` injects our private CA through
# its reqwest 0.12 client hook. Upgrading this plugin must be tested together
# with the direct reqwest dependency below.
tauri-plugin-updater = "=2.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# In-process team MCP server (team_mcp.rs) — streamable-http JSON-RPC.
# Already in Cargo.lock as a transitive dependency of the embedded upstream
# runtime (axum 0.8); minimal
# features: HTTP/1.1 + JSON body extraction + tokio IO.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
uuid = { version = "1", features = ["v7"] }
# statusMatch patterns in connector cli.json files (CLI connector auth).
regex = "1"

# EchoAgent's in-process runtime adapter. The Apache-2.0 Runtime source snapshot
# is tracked directly at <repo>/vendor/grok-build (see ECHOAGENT_VENDOR.json and
# THIRD_PARTY_NOTICES.md); these are relative path dependencies into it. Cargo
# resolves their `.workspace = true` fields against that root Cargo.toml. We do
# not join that workspace (see the explicit [workspace] table below).
xai-acp-lib = { path = "../vendor/grok-build/crates/codegen/xai-acp-lib" }
xai-grok-shell = { path = "../vendor/grok-build/crates/codegen/xai-grok-shell" }
xai-grok-tools = { path = "../vendor/grok-build/crates/codegen/xai-grok-tools" }
xai-tool-runtime = { path = "../vendor/grok-build/crates/common/xai-tool-runtime" }
xai-tool-protocol = { path = "../vendor/grok-build/crates/common/xai-tool-protocol" }
xai-tool-types = { path = "../vendor/grok-build/crates/common/xai-tool-types" }
futures = "0.3"
schemars = "1"
agent-client-protocol = { version = "0.10.4", features = ["unstable"] }
dirs = "6"
toml = "0.8"
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Local avatar thumbnails for the expert marketplace (PNG decode + JPEG encode).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
# Open URLs / local paths with the OS default handler (markdown links & paths).
open = "5"
# Fetch available models from a provider's /models endpoint (multi-model setup).
# rustls-tls avoids a native OpenSSL dependency on Windows.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
quick-xml = "0.38"
url = "2.5"
urlencoding = "2.1"
# Enterprise Skill sync: package digest/signature verification and safe ZIP extraction.
sha2 = "0.10"
ed25519-dalek = "2.2"
zip = { version = "3", default-features = false, features = ["deflate"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"

[target.'cfg(target_os = "windows")'.dependencies]
# Call Windows DPAPI directly. Spawning PowerShell made credential persistence
# depend on .NET assembly loading and discarded the actual encryption error.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3"

# Dev profile - enable debug info and use safer optimization
[profile.dev]
debug = true
opt-level = 0
incremental = true

[profile.release]
incremental = true
codegen-units = 16

# Declare an explicit, self-contained workspace so Cargo does NOT pull this
# crate into the upstream workspace (which would inherit its profile/lint
# settings and the 80 workspace members). The path dependencies above still
# resolve their `.workspace = true` fields against that root.
[workspace]
members = ["."]
