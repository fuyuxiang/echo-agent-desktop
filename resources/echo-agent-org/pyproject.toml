[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "echo-agent-desktop-org"
version = "1.0.1"
description = "Echo Agent Desktop 内置企业组织知识库插件"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

# Target is the MODULE, not a function: echo-agent's loader inspects the target
# for an `activate` attribute and a module-level MANIFEST dict
# (see echo_agent/plugins/loader.py:83-111).
[project.entry-points."echo_agent.plugins"]
org = "echo_agent_org.plugin"

[tool.hatch.build.targets.wheel]
packages = ["echo_agent_org"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
