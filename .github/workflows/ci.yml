name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: node scripts/verify-vendored-runtime.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-vendored-runtime.mjs
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --lib -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -j 2

  windows-search-bundle:
    name: Windows built-in tool reliability
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/echo-agent-build -> target
      # Release profile activates the automatic rg.exe download, pinned hash
      # verification, ZIP extraction and include_bytes! path. The test then
      # executes that embedded binary after runtime extraction.
      - name: Build and execute bundled rg.exe
        run: >-
          cargo test --locked --release
          --manifest-path vendor/echo-agent-build/Cargo.toml
          -p echo-agent-tools
          implementations::echo_agent_build::grep::tests::tool_grep_finds_matches
      - name: Verify parallel tool stream recovery on Windows
        run: >-
          cargo test --locked --release
          --manifest-path vendor/echo-agent-build/Cargo.toml
          -p echo-agent-sampler
          ambiguous_parallel_tools_retry_once_with_parallel_disabled
