name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: node scripts/verify-vendored-runtime.mjs
      - run: node scripts/release-version.mjs check
      - run: bash -n scripts/build.sh scripts/prepare-update-artifacts.sh scripts/publish-update.sh scripts/publish-all-updates.sh
      - run: python3 -m unittest discover -s deploy/update-server -p 'test_*.py'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node scripts/verify-vendored-runtime.mjs
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --lib -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -j 2

  automation-macos:
    name: Automation / macOS Intel + Apple Silicon
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '23.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml --lib --target x86_64-apple-darwin
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml --lib --target aarch64-apple-darwin
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib automation:: -j 2

  automation-windows:
    name: Automation / Windows
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '23.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml --lib
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib automation:: -j 2

  windows-search-bundle:
    name: Windows built-in tool reliability
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Parse PowerShell release script
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/build.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '23.x'
          # setup-protoc queries the GitHub Releases API. Authenticate those
          # read-only requests so shared runner IP rate limits cannot break CI.
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/echo-agent-build -> target
      # Release profile activates the automatic rg.exe download, pinned hash
      # verification, ZIP extraction and include_bytes! path. The test then
      # executes that embedded binary after runtime extraction.
      - name: Build and execute bundled rg.exe
        run: >-
          cargo test --locked --release
          --manifest-path vendor/echo-agent-build/Cargo.toml
          -p echo-agent-tools
          implementations::echo_agent_build::grep::tests::tool_grep_finds_matches
      - name: Verify parallel tool stream recovery on Windows
        run: >-
          cargo test --locked --release
          --manifest-path vendor/echo-agent-build/Cargo.toml
          -p echo-agent-sampler
          ambiguous_parallel_tools_retry_once_with_parallel_disabled
