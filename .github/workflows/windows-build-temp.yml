name: windows-build-temp

on:
  push:
    branches:
      - ci/windows-build-20260831
    paths:
      - .github/workflows/windows-build-temp.yml

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install protoc 29.3
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "protoc-29.3-win64.zip"
          Invoke-WebRequest -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-win64.zip" -OutFile $archive
          New-Item -ItemType Directory -Force -Path "C:\Tools\protoc" | Out-Null
          Expand-Archive -Path $archive -DestinationPath "C:\Tools\protoc" -Force
          & "C:\Tools\protoc\bin\protoc.exe" --version

      - name: Prepare embedded runtime
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/setup.ps1
          $revision = git -C vendor/grok-build rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw "Embedded Runtime is not a Git checkout" }
          if ($revision -ne "c2ad97f87aea4303b6000a2c22128bc91ee76c9b") {
            throw "Unexpected Embedded Runtime revision: $revision"
          }
          if (-not (Test-Path "vendor\grok-build\crates\codegen\xai-grok-agent\Cargo.toml")) {
            throw "Embedded Runtime checkout is incomplete"
          }
          $global:LASTEXITCODE = 0

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Disable updater artifact signing for CI installer
        shell: pwsh
        run: |
          $configPath = "src-tauri\tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.bundle.createUpdaterArtifacts = $false
          $config | ConvertTo-Json -Depth 100 | Set-Content $configPath -Encoding utf8

      - name: Build unsigned NSIS installer
        shell: pwsh
        run: |
          $env:CARGO_BUILD_JOBS = "2"
          $logPath = Join-Path $env:RUNNER_TEMP "windows-build.log"
          pnpm tauri build --bundles nsis 2>&1 | Tee-Object -FilePath $logPath
          $buildExitCode = $LASTEXITCODE
          "BUILD_EXIT_CODE=$buildExitCode" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          exit 0

      - name: Commit installer or failure log to temporary branch
        if: always()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ($env:BUILD_EXIT_CODE -ne "0") {
            New-Item -ItemType Directory -Force -Path "ci-artifacts" | Out-Null
            Copy-Item (Join-Path $env:RUNNER_TEMP "windows-build.log") "ci-artifacts\windows-build.log" -Force
            git add --force "ci-artifacts\windows-build.log"
            git commit -m "ci: attach failed Windows build log [skip ci]"
            git push origin "HEAD:$env:GITHUB_REF_NAME"
            throw "Windows build failed with exit code $env:BUILD_EXIT_CODE"
          }
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not generated" }
          New-Item -ItemType Directory -Force -Path "ci-artifacts" | Out-Null
          $destination = "ci-artifacts\EchoAgent_0.3.8_windows_x64-setup.exe"
          Copy-Item $installer.FullName $destination -Force
          git add --force $destination
          git commit -m "ci: attach Windows x64 installer [skip ci]"
          git push origin "HEAD:$env:GITHUB_REF_NAME"
