name: desktop-validation
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  packaged-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          version: '23.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm ide:build
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - run: pnpm ide:stage
      - run: node vendor/theia-platform/node_modules/playwright/cli.js install chromium
      - run: node scripts/validate-theia-runtime.mjs
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --tests -j 2
      - name: Package macOS validation build
        if: runner.os == 'macOS'
        run: pnpm tauri build --bundles app,dmg --config src-tauri/tauri.macos.conf.json --config '{"identifier":"com.echoagent.validation","bundle":{"createUpdaterArtifacts":false}}'
      - name: Start packaged macOS WebView and check native IPC
        if: runner.os == 'macOS'
        run: node scripts/validate-packaged-desktop.mjs src-tauri/target/release/bundle/macos/EchoAgent.app/Contents/MacOS/echoagent
      - name: Package Windows validation build
        if: runner.os == 'Windows'
        run: pnpm tauri build --bundles nsis --config '{"identifier":"com.echoagent.validation","bundle":{"createUpdaterArtifacts":false}}'
      - name: Install and start Windows WebView; check native IPC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'EchoAgentValidation'
          $result = Start-Process $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer failed: $($result.ExitCode)" }
          node scripts/validate-packaged-desktop.mjs "$installDir/echoagent.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-validation-${{ matrix.os }}
          path: src-tauri/target/release/bundle
          if-no-files-found: error
