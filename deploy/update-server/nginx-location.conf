# EchoAgent desktop updater artifacts. Keep these locations before `location /`
# in the HTTPS server on port 8787.
location ^~ /desktop-updates/stable/ {
    alias /opt/echo-agent-desktop-updates/stable/;
    autoindex off;
    # A platform without a published manifest is explicitly "no update".
    # This keeps first-run and independently rolled-out platforms healthy.
    error_page 404 = @echoagent_no_desktop_update;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    default_type application/json;
    limit_except GET HEAD { deny all; }
}

location @echoagent_no_desktop_update {
    return 204;
}

location ^~ /desktop-updates/releases/ {
    alias /opt/echo-agent-desktop-updates/releases/;
    autoindex off;

    # Versioned installers are immutable once a platform manifest exposes them.
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    default_type application/octet-stream;

    limit_except GET HEAD { deny all; }
}
