<script>
  // Theia stored English as an explicit locale before Echo Code shipped Chinese.
  // Migrate that old value once, before the frontend bundle reads `localeId`.
  // Later user-selected languages remain untouched.
  (() => {
    if (!new URLSearchParams(window.location.search).has('echoBridgeToken')) return;
    try {
      const marker = 'echo-code-default-locale-v1';
      if (localStorage.getItem(marker)) return;
      const previous = localStorage.getItem('localeId');
      if (!previous || previous === 'en') localStorage.setItem('localeId', 'zh-cn');
      localStorage.setItem(marker, '1');
    } catch {
      // An unavailable storage API must not prevent the IDE from starting.
    }
  })();
</script>
