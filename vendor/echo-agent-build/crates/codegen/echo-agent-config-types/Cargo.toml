[package]
license = "Apache-2.0"
name = "echo-agent-config-types"
version = "0.1.0"
edition.workspace = true
description = "Leaf configuration value types for the echoagent CLI, extracted from echo-agent-runtime for dependency inversion."

[dependencies]
agent-client-protocol = { workspace = true }
indexmap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
echo-agent-announcements = { workspace = true }
echo-agent-config = { workspace = true }
echo-agent-mcp = { workspace = true }

[features]
default-bazel = []

[lints]
workspace = true
