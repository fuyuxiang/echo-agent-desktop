[package]
license = "Apache-2.0"
name = "echo-agent-subagent-resolution"
version = "0.1.0"
edition.workspace = true
description = "Shared subagent definition, runtime, prompt, and resume resolution"

[dependencies]
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
echo-agent-core = { path = "../echo-agent-core" }
echo-agent-sampling-types = { path = "../echo-agent-sampling-types" }
echo-agent-tools = { path = "../echo-agent-tools" }
echo-agent-tool-types.workspace = true

[features]
default = []

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
toml = { workspace = true }

[lints]
workspace = true
