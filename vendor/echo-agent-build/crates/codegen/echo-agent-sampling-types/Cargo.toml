[package]
license = "Apache-2.0"
name = "echo-agent-sampling-types"
version = "0.1.0"
edition.workspace = true
description = "Pure data types for the EchoAgent sampling / chat-completion API layer"

[dependencies]
async-openai = { workspace = true }
chrono = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
reqwest = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
tracing = { workspace = true }
echo-agent-circuit-breaker = { workspace = true }
echo-agent-compaction = { path = "../../common/echo-agent-compaction" }
echo-agent-tools = { path = "../echo-agent-tools" }

[dev-dependencies]
assert_matches = { workspace = true }

[lints]
workspace = true
